<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .dash{stroke-dasharray:6 5}
      .t{font-size:16px;font-weight:600;fill:#0f172a}
      .s{font-size:13px;fill:#475569}
      .m{font-size:12px;fill:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:1.2px}
      .tag{font-size:11px;font-weight:600}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect width="1400" height="880" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">Action Item Verifier · architecture</text>
  <text x="40" y="72" class="s">AI reads the meeting, code checks the AI. TypeScript · Next.js · Tailwind · Prisma · OpenAI</text>

  <!-- column headers -->
  <text x="40" y="112" class="h">1 · LOAD MEETINGS</text>
  <text x="360" y="112" class="h">2 · VERIFY EACH ACTION ITEM</text>
  <text x="980" y="112" class="h">3 · SAVE AND SHOW</text>

  <!-- ========== Column A ========== -->
  <rect x="40" y="128" width="270" height="92" rx="12" class="box dash"/>
  <text x="58" y="156" class="t">Circleback API</text>
  <text x="58" y="178" class="s">meetings · transcripts · action items</text>
  <text x="58" y="202" class="m">circleback/api.ts · needs key</text>

  <rect x="40" y="240" width="270" height="92" rx="12" class="box"/>
  <text x="58" y="268" class="t">Sample meetings</text>
  <text x="58" y="290" class="s">3 written + 2 real Circleback</text>
  <text x="58" y="314" class="m">data/samples/*.json</text>

  <rect x="40" y="352" width="270" height="92" rx="12" class="box"/>
  <text x="58" y="380" class="t">Circleback export → Import</text>
  <text x="58" y="402" class="s">your meeting as JSON, uploaded</text>
  <text x="58" y="426" class="m">tools/circleback-export.js</text>

  <rect x="40" y="500" width="270" height="110" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="58" y="530" class="t">Meeting source</text>
  <text x="58" y="552" class="s">Turns every input into one</text>
  <text x="58" y="570" class="s">Meeting type: attendees, timed</text>
  <text x="58" y="588" class="s">transcript lines, action items</text>
  <text x="236" y="530" class="m">source.ts</text>

  <!-- inputs feed the source via a left trunk -->
  <path d="M40 174 H 22 V 555 H 34" class="ln" marker-end="url(#ar)"/>
  <path d="M40 286 H 22" class="ln"/>
  <path d="M40 398 H 22" class="ln"/>

  <!-- source -> pipeline start -->

  <!-- ========== Column B container ========== -->
  <rect x="360" y="128" width="580" height="590" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="156" class="m">verify/index.ts · verifyMeeting()</text>

  <!-- B1 -->
  <rect x="384" y="172" width="532" height="96" rx="12" class="box"/>
  <text x="404" y="200" class="t">① Speaker names</text>
  <text x="404" y="224" class="s">Use Circleback's names when it has them.</text>
  <text x="404" y="244" class="s">Only “Participant N” goes to the AI, which must quote the proof.</text>
  <text x="404" y="260" class="m"></text>

  <!-- B2 -->
  <rect x="384" y="290" width="532" height="190" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="404" y="318" class="t">② One AI read of the whole meeting</text>
  <text x="840" y="318" class="m">ai.ts</text>
  <text x="404" y="346" class="s">• Who each placeholder speaker is, with a quote</text>
  <text x="404" y="370" class="s">• Every promise and assignment: who, what, exact line, reply</text>
  <text x="404" y="394" class="s">• Each action item matched to a promise:</text>
  <text x="420" y="414" class="s">supported · weak · contradicted · unsupported</text>
  <text x="404" y="442" class="m">OpenAI · strict JSON schema · temperature 0</text>
  <text x="404" y="462" class="m">answers cached in .data/ai-cache</text>

  <!-- B3 -->
  <rect x="384" y="502" width="532" height="196" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="404" y="530" class="t">③ Referee: plain code, no AI</text>
  <text x="826" y="530" class="m">referee.ts</text>
  <text x="404" y="558" class="s">✓ Every quote must appear word for word, or it's thrown out</text>
  <text x="404" y="582" class="s">✓ A name counts only if the quote contains it</text>
  <text x="404" y="606" class="s">✓ “Supported” needs a verified promise</text>
  <text x="404" y="630" class="s">✓ Owner confirmed only by the owner's own words</text>
  <text x="404" y="654" class="s">✓ Fixed rules decide the owner answer, not the AI</text>
  <text x="404" y="682" font-size="13" font-weight="600" fill="#065f46">A made-up quote can never produce “Supported”.</text>

  <path d="M650 268 V 284" class="ln" marker-end="url(#ar)"/>
  <path d="M650 480 V 496" class="ln" marker-end="url(#ar)"/>

  <!-- ========== Column C ========== -->
  <rect x="980" y="128" width="380" height="214" rx="12" class="box"/>
  <text x="1000" y="156" class="t">Two answers per action item</text>
  <text x="1000" y="182" class="h" font-size="11">IS THE TASK REAL?</text>
  <rect x="1000" y="192" width="92" height="24" rx="12" fill="#d1fae5"/><text x="1046" y="209" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Supported</text>
  <rect x="1098" y="192" width="56" height="24" rx="12" fill="#fef3c7"/><text x="1126" y="209" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Weak</text>
  <rect x="1160" y="192" width="186" height="24" rx="12" fill="#ffe4e6"/><text x="1253" y="209" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">Unsupported · Contradicted</text>
  <text x="1000" y="240" class="h" font-size="11">DID THE OWNER TAKE IT ON?</text>
  <rect x="1000" y="250" width="92" height="24" rx="12" fill="#d1fae5"/><text x="1046" y="267" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Confirmed</text>
  <rect x="1098" y="250" width="248" height="24" rx="12" fill="#ede9fe"/><text x="1222" y="267" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Never acked · Declined · Someone else</text>
  <rect x="1000" y="280" width="226" height="24" rx="12" fill="#ede9fe"/><text x="1113" y="297" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Unidentified · Not in meeting</text>
  <text x="1000" y="328" class="s">+ possibly missed tasks · quotes · timestamps</text>

  <rect x="980" y="370" width="380" height="88" rx="12" class="box"/>
  <text x="1000" y="398" class="t">Store</text>
  <text x="1000" y="420" class="s">JSON files by default · Prisma → SQLite or Postgres</text>
  <text x="1000" y="442" class="m">store.ts · prisma/schema.prisma</text>

  <rect x="980" y="486" width="380" height="124" rx="12" class="box"/>
  <text x="1000" y="514" class="t">Next.js web app</text>
  <text x="1000" y="538" class="s">Meeting list → item cards with labels</text>
  <text x="1000" y="558" class="s">Click a quote → jump to that transcript moment</text>
  <text x="1000" y="586" class="m">POST /api/meetings/[id]/verify</text>

  <rect x="980" y="634" width="380" height="84" rx="12" class="box"/>
  <text x="1000" y="662" class="t">Command line</text>
  <text x="1000" y="686" class="m">npm run verify -- cb-es2002a</text>
  <text x="1000" y="706" class="m">npm run eval -- --model gpt-4.1</text>

  <path d="M916 600 C 950 600 950 235 974 235" class="ln" marker-end="url(#ar)"/>
  <path d="M1170 342 V 364" class="ln" marker-end="url(#ar)"/>
  <path d="M1170 458 V 480" class="ln" marker-end="url(#ar)"/>

  <!-- ========== Eval band ========== -->
  <rect x="40" y="750" width="1320" height="96" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="62" y="780" class="h" fill="#9a3412">EVALUATION LOOP</text>
  <rect x="62" y="792" width="300" height="40" rx="8" fill="#fff" stroke="#fed7aa"/>
  <text x="78" y="817" class="s">ground-truth.json · 23 hand labels</text>
  <rect x="430" y="792" width="300" height="40" rx="8" fill="#fff" stroke="#fed7aa"/>
  <text x="446" y="817" class="s">scripts/eval.ts runs the full pipeline</text>
  <rect x="798" y="792" width="540" height="40" rx="8" fill="#fff" stroke="#fed7aa"/>
  <text x="814" y="817" class="s">Task right · owner right · cited the right line</text>
  <path d="M362 812 H 424" class="ln" marker-end="url(#ar)"/>
  <path d="M730 812 H 792" class="ln" marker-end="url(#ar)"/>
  <path d="M650 718 V 744" class="ln dash" marker-end="url(#ar)"/>
  <path d="M310 540 H 338 V 211 H 378" class="ln" marker-end="url(#ar)"/>
</svg>
